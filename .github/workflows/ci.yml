name: CI

on:
  pull_request:

jobs:
  pmon-windows-diag:
    name: pmon windows diag
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        mode: [parallel, serial]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - name: Test
        shell: bash
        env:
          GOFLAGS: -count=1
        run: |
          for i in $(seq 1 8); do
            echo "=== iteration $i"
            flags=""
            if [ "${{ matrix.mode }}" = serial ]; then flags="-p 1 -parallel 1"; fi
            go test -v $flags ./pmon/... ./mysqlwire/... 2>&1 | grep -E 'AWSDIAG|--- FAIL|^FAIL|actual_AWS_CLI|^ok .*pmon/internal/cli' || true
          done
