name: pmon release binaries

# Attaches per-platform pmon archives to a pmon-v* release, so the Homebrew formula installs a binary
# instead of compiling Go on every machine, plus the signed and notarized macOS menu-bar app.
on:
  push:
    tags: ["pmon-v*"]
  # Re-run for an existing tag with `gh workflow run pmon-release-binaries.yml --ref <tag>`. The tag is the run's
  # own ref, never an input: the `release` environment authorizes that ref, so it must be what gets built.
  workflow_dispatch:

permissions:
  contents: write

# Two runs for one tag would interleave their uploads.
concurrency:
  group: pmon-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require a pmon-v* tag
        run: |
          [[ "$GITHUB_REF" == refs/tags/pmon-v* ]] || { echo "::error::run this on a pmon-v* tag, not $GITHUB_REF"; exit 1; }

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: pmon/go.mod

      - name: Build and archive every platform
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          version="${TAG#pmon-v}"
          mkdir -p dist

          # Every target is attempted even after one fails — a broken platform is a fact about that
          # platform, and the others still need to report (the same reason db-matrix.yml sets
          # fail-fast: false). Hence no `set -e`: failures accumulate and the step exits once at the end.
          #
          # CGO_ENABLED=0 keeps each binary static, so it runs on any host of that platform regardless
          # of libc. GOWORK=off because the repo root is a workspace; a release build resolves pmon's
          # own go.mod, the same as a fresh clone or a formula build — and is also what lets Go
          # stamp the revision itself, which it skips while a workspace is active. The commit is
          # not passed as an -X: -trimpath and a shallow checkout both preserve that stamping, so
          # a flag would only add a second source of truth for the same fact.
          failed=()
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "::group::$os/$arch"
            if (cd pmon && GOWORK=off CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                  go build -trimpath -ldflags "-s -w" -o "../dist/pmon" .) &&
               tar -C dist -czf "dist/pmon_${version}_${os}_${arch}.tar.gz" pmon; then
              echo "built $os/$arch"
            else
              echo "::error::pmon build failed for $os/$arch"
              failed+=("$os/$arch")
            fi
            rm -f dist/pmon
            echo "::endgroup::"
          done

          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::${#failed[@]} of 4 targets failed: ${failed[*]}"
            exit 1
          fi

      # One checksum file over every release file, so a formula bump can read the hash it needs and a user
      # can verify a download independently.
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          .github/scripts/release-checksums.sh "$TAG" pmon_ dist
          gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --repo "$GITHUB_REPOSITORY" --clobber

  # The menu-bar app, with pmon bundled inside it. Signing needs the `release` environment, which only a pmon-v*
  # tag may use.
  tray:
    needs: binaries
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: pmontray/go.mod

      - name: Load the Developer ID identities
        env:
          MACOS_APP_P12: ${{ secrets.MACOS_APP_P12 }}
          MACOS_APP_P12_PASSWORD: ${{ secrets.MACOS_APP_P12_PASSWORD }}
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_INSTALLER_P12_PASSWORD:
            ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          echo "KEYCHAIN=$RUNNER_TEMP/sign.keychain-db" >>"$GITHUB_ENV"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >>"$GITHUB_ENV"
          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db" NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          pmontray/signing-keychain.sh "$KEYCHAIN"
          (umask 077 && printf '%s\n' "$NOTARY_KEY" >"$NOTARY_KEY_PATH")

      - name: Build, sign, notarize
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          export VERSION="${TAG#pmon-v}" SIGN_KEYCHAIN="$KEYCHAIN" ARCHS="arm64 amd64"
          SIGN_IDENTITY="Developer ID Application: RIDI Corporation (SNTDSH9YYM)" \
            pmontray/build-app.sh "$RUNNER_TEMP/app"
          INSTALLER_IDENTITY="Developer ID Installer: RIDI Corporation (SNTDSH9YYM)" \
            pmontray/package-macos.sh "$RUNNER_TEMP/app/Proxy Monster Desktop.app" dist
          # Both artifacts must reach users notarized; the scripts skip notarization when its inputs are unset.
          spctl -a -vv -t install dist/*.pkg
          ditto -x -k dist/*.zip "$RUNNER_TEMP/unzipped"
          spctl -a -vv -t exec "$RUNNER_TEMP/unzipped/Proxy Monster Desktop.app"
          xcrun stapler validate "$RUNNER_TEMP/unzipped/Proxy Monster Desktop.app"

      - name: Remove the signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8"
          if [ -e "$RUNNER_TEMP/sign.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/sign.keychain-db"; fi

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          .github/scripts/release-checksums.sh "$TAG" ProxyMonsterDesktop_ dist
          gh release upload "$TAG" dist/ProxyMonsterDesktop_* dist/checksums.txt --repo "$GITHUB_REPOSITORY" --clobber
