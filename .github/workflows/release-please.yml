name: release-please

# Trains and their tags are in release-please-config.json. Merging a release PR is what tags and
# publishes; a push to main only opens or updates the PR.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two concurrent runs would race on the same release branches.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A GitHub App installation token, not GITHUB_TOKEN: events from GITHUB_TOKEN cannot start another
      # workflow, so a release PR's checks sit unrunnable — and main requires them to merge.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.token.outputs.token }}
