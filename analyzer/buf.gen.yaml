version: v2
# Generates the Go bindings for every proto Go code uses except cp-go's gobridge services: analyzer.proto
# (the analyzer<->JVM FFM boundary), controlplane.proto (the proxy<->control-plane gRPC contract) and the
# engine.proto/athena.proto they share. One package, so each message has one registered Go type.
managed:
  enabled: true
  override:
    - file_option: go_package
      value: github.com/ridi-oss/proxy-monster/analyzer/probe/pb
plugins:
  - local: protoc-gen-go
    out: probe/pb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: probe/pb
    opt: paths=source_relative
