list_datasources=List datasources and their connection, catalog, and tag metadata.
get_datasource_liveness=Get the current proxy attachment status for a datasource.
browse_catalog=Browse the schemas, tables, and columns in a datasource catalog.
get_table_detail=Inspect live column details for one datasource table.
list_column_tags=List classified columns and their tags in a datasource.
set_column_classification=Set tags and an optional mask function on one column.
set_column_classifications=Set tags and an optional mask function on many columns of one datasource in a single all-or-nothing call.
clear_column_classification=Remove the classification from one column.
list_policies=List Cedar policies.
get_policy=Get one Cedar policy by name.
validate_policy=Validate Cedar policy source without saving it.
get_policy_schema=Get the Cedar schema used for access-control policies.
create_policy=Create a Cedar policy.
update_policy=Update a Cedar policy by name.
enable_policy=Enable a Cedar policy.
disable_policy=Disable a Cedar policy.
delete_policy=Delete a user-managed Cedar policy.
list_roles=List access-control roles.
create_role=Create an access-control role.
update_role=Update an access-control role by name.
delete_role=Delete a user-managed access-control role.
list_role_assignments=List direct principal-to-role assignments.
assign_role=Assign a role directly to a principal.
unassign_role=Remove a direct role assignment from a principal.
list_users=List locally known users.
create_user=Create a local user.
update_user=Update a local user by principal.
deprovision_user=Deactivate a user and revoke active credentials.
list_groups=List identity groups.
create_group=Create a local group.
update_group=Update a local group by name.
delete_group=Delete a user-managed group.
add_group_member=Add a user to a group.
remove_group_member=Remove a user from a group.
set_group_roles=Replace the roles assigned to a group.
list_mask_fns=List masking functions.
create_mask_fn=Create a masking function.
update_mask_fn=Update a masking function by name.
delete_mask_fn=Delete a masking function.
list_connectable_datasources=Lists the datasources you can query, with each one's engine, default schemas, and description. Start here to pick a datasource for describe_datasource or run_query.
describe_datasource=Returns the description and the schemas, tables and columns of one datasource you can connect to. Call this before run_query so the SQL names real tables and columns.
run_query=Runs SQL on a datasource as you, under your own roles; the same access rules as the console editor apply, so sensitive columns may come back masked. Call describe_datasource first. Waits up to 10 seconds: a finished query returns the first 200 rows of its last statement that returned rows in page (nextOffset gives the next page for get_query_result); a slower one returns its taskId to poll with get_query_status. The query has run whenever taskId is present, so never re-run it: if statusError or pageError is set, the status or the page could not be read, and get_query_status or get_query_result with that taskId reads them. If a statement failed in the database, page.errorDetail carries its error. If a statement is denied, its entry in statements carries a decisionId: offer the user request_approval with that decisionId.
get_query_result=Returns rows of a finished run_query task, one page at a time. Use offset and limit to page (nextOffset gives the next page) and statement to pick a statement of a multi-statement batch. When truncatedAt is set, your row cap cut the whole result at that many rows; it is not the page size.
get_query_status=Returns the status of a run_query task (EXECUTING, EXECUTED, FAILED, CANCELLED) and each statement's status, row count and error.
cancel_query=Cancels a running run_query task.
discover_roles=Lists the roles a query could be approved to run under, and whether each would return it masked. Call this before request_approval to choose roleName.
request_approval=Asks an approver to run a query under a stronger role. Either pass decisionId from a denied run_query statement, or pass datasource, sql and title. roleName comes from discover_roles; reason explains why the user needs it.
list_my_approvals=Lists the query approval requests you created, optionally filtered by status (PENDING, APPROVED, REJECTED, EXECUTING, EXECUTED, FAILED, CANCELLED).
list_approval_inbox=Lists the pending query approval requests you may approve or reject.
get_approval=Returns one query approval request, its per-statement run status, and what you can do with it (decide, execute, cancel).
approve_approval=Approves a pending query approval request. You cannot approve your own request.
reject_approval=Rejects a pending query approval request with a reason the requester will see.
execute_approval=Runs an approved query under its approved role. Only the approver who approved it can run it, and it runs once. Poll get_approval until it is EXECUTED, then read rows with get_approval_result.
get_approval_result=Returns rows of an executed query approval, masked for you, one page at a time. Use offset and limit to page (nextOffset gives the next page) and statement to pick a statement. When truncatedAt is set, your row cap cut the whole result at that many rows; it is not the page size.
cancel_approval=Cancels a query approval that is still running.
list_group_members=Lists the members of one group.
list_group_roles=Lists the roles one group grants its members.
get_principal_rate=Returns the last reset of one principal's spent result rates, or null when it was never reset.
reset_principal_rate=Resets one principal's spent result rates now, with a reason recorded in the audit trail.
create_datasource=Pre-provisions a datasource by name before its proxy first registers; engine is postgres or mysql, and the proxy's registration fills in host, port and dbName.
update_datasource=Updates a datasource's name and advisory connection fields; omitted fields keep their values. The engine cannot change.
delete_datasource=Deletes a datasource. Refused while a proxy is attached or its requests are still active.
refresh_datasource=Asks every attached proxy of a datasource to re-introspect its catalog now, and returns how many were notified.
test_datasource=Reports whether a proxy is attached to a datasource and when its catalog was last synced.
get_pmon_guide=Returns how to use this instance through pmon: install it, log in once in a browser, use this MCP server over that login, and print connection strings for SQL clients and scripts for each datasource you may connect to. Call it when the user wants a SQL client, a script, or one login shared across agents.
get_usage_guide=Returns the proxy-monster usage guide: running queries, reading masked results, why a query was denied and where the reason is, requesting access or an approval, and connecting SQL clients and agents. Call it before explaining how this system behaves, instead of guessing.
get_admin_guide=Returns the proxy-monster admin guide: column tags, roles and the shipped presets, Cedar policy actions and context, group-to-role mapping, result caps, approvals, and the MCP admin tools and scopes. Call it before configuring this instance or explaining why a policy behaves as it does, instead of guessing.
get_my_permissions=Returns your roles and where each comes from (direct, a group, or a time-boxed access grant with its expiry), plus whether you are an admin, may read the whole audit log, and may approve. Use it to explain why a query is allowed or denied, or which role to request.
list_audit=Lists recent audit events, newest first. You see every principal's events only if you may read the whole audit log; otherwise only your own. limit is 1 to 500, default 100.
get_audit_event=Returns one audit event by id. An event you may not read answers not found, the same as a missing one.
request_access=Asks an approver to grant you a role for a while (a JIT elevation). roleName names the role, reason explains why, datasource optionally scopes the request, durationSec is how long the grant lasts (default 3600).
list_access_requests=Lists the role and rate-reset requests you may see, optionally filtered by status (PENDING, APPROVED, REJECTED).
list_access_grants=Lists the role grants you may see. principal selects whose grants to look for; active limits to grants still in force.
reset_my_rate=Asks an approver to reset your spent result rates. reason explains why; denyReason is the rate message you were refused with.
list_query_history=Lists your recent distinct queries from the console editor history, newest first. limit is 1 to 200, default 50.
clear_query_history=Deletes your whole editor query history and returns how many rows were removed.
delete_query_task=Deletes one of your own run_query tasks and its saved result. deleted is false when the task is not yours or does not exist.
approve_access_request=Approves a pending role or rate-reset request. durationSec overrides how long a role grant lasts. You cannot approve your own request, and query approvals use approve_approval.
reject_access_request=Rejects a pending role or rate-reset request with a reason the requester will see.
revoke_access_grant=Revokes an active role grant before it expires.
list_tokens=Lists your database connection tokens (never their secrets). principal lists another principal's tokens, which only an identity admin may do.
mint_token=Creates a database connection token for you and returns its secret once; it is never shown again. name labels it, ttlSeconds sets its lifetime (60 to 86400, default 3600).
revoke_token=Revokes a database connection token by id. You may revoke your own; an identity admin may revoke anyone's.
