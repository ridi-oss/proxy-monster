list_datasources=List datasources and their connection, catalog, and tag metadata.
get_datasource_liveness=Get the current proxy attachment status for a datasource.
browse_catalog=Browse the schemas, tables, and columns in a datasource catalog.
get_table_detail=Inspect live column details for one datasource table.
list_column_tags=List classified columns and their tags in a datasource.
set_column_classification=Set tags and an optional mask function on one column.
set_column_classifications=Set tags and an optional mask function on many columns of one datasource in a single all-or-nothing call.
clear_column_classification=Remove the classification from one column.
list_policies=List Cedar policies.
get_policy=Get one Cedar policy by name.
validate_policy=Validate Cedar policy source without saving it.
get_policy_schema=Get the Cedar schema used for access-control policies.
create_policy=Create a Cedar policy.
update_policy=Update a Cedar policy by name.
enable_policy=Enable a Cedar policy.
disable_policy=Disable a Cedar policy.
delete_policy=Delete a user-managed Cedar policy.
list_roles=List access-control roles.
create_role=Create an access-control role.
update_role=Update an access-control role by name.
delete_role=Delete a user-managed access-control role.
list_role_assignments=List direct principal-to-role assignments.
assign_role=Assign a role directly to a principal.
unassign_role=Remove a direct role assignment from a principal.
list_users=List locally known users.
create_user=Create a local user.
update_user=Update a local user by principal.
deprovision_user=Deactivate a user and revoke active credentials.
list_groups=List identity groups.
create_group=Create a local group.
update_group=Update a local group by name.
delete_group=Delete a user-managed group.
add_group_member=Add a user to a group.
remove_group_member=Remove a user from a group.
set_group_roles=Replace the roles assigned to a group.
list_mask_fns=List masking functions.
create_mask_fn=Create a masking function.
update_mask_fn=Update a masking function by name.
delete_mask_fn=Delete a masking function.
list_connectable_datasources=Lists the datasources you can query, with each one's engine and default schemas. Start here to pick a datasource for describe_datasource or run_query.
describe_datasource=Lists the schemas, tables and columns of one datasource you can connect to. Call this before run_query so the SQL names real tables and columns.
run_query=Runs SQL on a datasource as you, under your own roles; the same access rules as the console editor apply, so sensitive columns may come back masked. Call describe_datasource first. Waits up to 10 seconds: a finished query returns the first 200 rows of its last statement that returned rows in page (nextOffset gives the next page for get_query_result); a slower one returns its taskId to poll with get_query_status. The query has run whenever taskId is present, so never re-run it: if statusError or pageError is set, the status or the page could not be read, and get_query_status or get_query_result with that taskId reads them. If a statement is denied, its entry in statements carries a decisionId: offer the user request_approval with that decisionId.
get_query_result=Returns rows of a finished run_query task, one page at a time. Use offset and limit to page (nextOffset gives the next page) and statement to pick a statement of a multi-statement batch. When truncatedAt is set, your row cap cut the whole result at that many rows; it is not the page size.
get_query_status=Returns the status of a run_query task (EXECUTING, EXECUTED, FAILED, CANCELLED) and each statement's status, row count and error.
cancel_query=Cancels a running run_query task.
discover_roles=Lists the roles a query could be approved to run under, and whether each would return it masked. Call this before request_approval to choose roleName.
request_approval=Asks an approver to run a query under a stronger role. Either pass decisionId from a denied run_query statement, or pass datasource, sql and title. roleName comes from discover_roles; reason explains why the user needs it.
list_my_approvals=Lists the query approval requests you created, optionally filtered by status (PENDING, APPROVED, REJECTED, EXECUTING, EXECUTED, FAILED, CANCELLED).
list_approval_inbox=Lists the pending query approval requests you may approve or reject.
get_approval=Returns one query approval request, its per-statement run status, and what you can do with it (decide, execute, cancel).
approve_approval=Approves a pending query approval request. You cannot approve your own request.
reject_approval=Rejects a pending query approval request with a reason the requester will see.
execute_approval=Runs an approved query under its approved role. Only the approver who approved it can run it, and it runs once. Poll get_approval until it is EXECUTED, then read rows with get_approval_result.
get_approval_result=Returns rows of an executed query approval, masked for you, one page at a time. Use offset and limit to page (nextOffset gives the next page) and statement to pick a statement. When truncatedAt is set, your row cap cut the whole result at that many rows; it is not the page size.
cancel_approval=Cancels a query approval that is still running.
