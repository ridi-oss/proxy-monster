list_datasources=데이터소스의 연결, 카탈로그 및 태그 메타데이터를 조회합니다.
get_datasource_liveness=데이터소스의 현재 프록시 연결 상태를 조회합니다.
browse_catalog=데이터소스 카탈로그의 스키마, 테이블 및 컬럼을 탐색합니다.
get_table_detail=데이터소스 테이블 하나의 실시간 컬럼 상세 정보를 조회합니다.
list_column_tags=데이터소스에서 분류된 컬럼과 태그를 조회합니다.
set_column_classification=컬럼 하나에 태그와 선택적 마스킹 함수를 지정합니다.
set_column_classifications=데이터소스 하나의 여러 컬럼에 태그와 선택적 마스킹 함수를 한 번에 모두 적용하거나 모두 취소합니다.
clear_column_classification=컬럼 하나의 분류를 제거합니다.
list_policies=Cedar 정책을 조회합니다.
get_policy=이름으로 Cedar 정책 하나를 조회합니다.
validate_policy=Cedar 정책 소스를 저장하지 않고 검증합니다.
get_policy_schema=접근 제어 정책에 사용하는 Cedar 스키마를 조회합니다.
create_policy=Cedar 정책을 생성합니다.
update_policy=이름으로 Cedar 정책을 수정합니다.
enable_policy=Cedar 정책을 활성화합니다.
disable_policy=Cedar 정책을 비활성화합니다.
delete_policy=사용자가 관리하는 Cedar 정책을 삭제합니다.
list_roles=접근 제어 역할을 조회합니다.
create_role=접근 제어 역할을 생성합니다.
update_role=이름으로 접근 제어 역할을 수정합니다.
delete_role=사용자가 관리하는 접근 제어 역할을 삭제합니다.
list_role_assignments=사용자에게 직접 지정된 역할을 조회합니다.
assign_role=사용자에게 역할을 직접 지정합니다.
unassign_role=사용자에게 직접 지정된 역할을 해제합니다.
list_users=로컬에 등록된 사용자를 조회합니다.
create_user=로컬 사용자를 생성합니다.
update_user=사용자 식별자로 로컬 사용자를 수정합니다.
deprovision_user=사용자를 비활성화하고 활성 자격 증명을 폐기합니다.
list_groups=ID 그룹을 조회합니다.
create_group=로컬 그룹을 생성합니다.
update_group=이름으로 로컬 그룹을 수정합니다.
delete_group=사용자가 관리하는 그룹을 삭제합니다.
add_group_member=그룹에 사용자를 추가합니다.
remove_group_member=그룹에서 사용자를 제거합니다.
set_group_roles=그룹에 지정된 역할을 교체합니다.
list_mask_fns=마스킹 함수를 조회합니다.
create_mask_fn=마스킹 함수를 생성합니다.
update_mask_fn=이름으로 마스킹 함수를 수정합니다.
delete_mask_fn=마스킹 함수를 삭제합니다.
list_connectable_datasources=쿼리할 수 있는 데이터소스와 각 데이터소스의 엔진 및 기본 스키마를 조회합니다. describe_datasource나 run_query에 쓸 데이터소스를 고를 때 먼저 호출하세요.
describe_datasource=연결할 수 있는 데이터소스 하나의 스키마, 테이블, 컬럼을 조회합니다. SQL에 실제 테이블과 컬럼 이름을 쓰도록 run_query 전에 호출하세요.
run_query=데이터소스에서 내 역할로 SQL을 실행합니다. 콘솔 에디터와 같은 접근 규칙이 적용되므로 민감한 컬럼은 마스킹되어 반환될 수 있습니다. 먼저 describe_datasource를 호출하세요. 최대 10초 기다리며, 끝난 쿼리는 행을 반환한 마지막 문장의 처음 200행을 page에 반환하고(nextOffset으로 get_query_result에서 다음 페이지 조회), 오래 걸리는 쿼리는 get_query_status로 확인할 taskId를 반환합니다. taskId가 있으면 쿼리는 이미 실행되었으니 다시 실행하지 마세요. statusError나 pageError가 있으면 상태나 페이지를 읽지 못한 것이니 그 taskId로 get_query_status나 get_query_result를 호출하세요. 거부된 문장은 statements 항목에 decisionId가 있으니 그 decisionId로 request_approval을 제안하세요.
get_query_result=끝난 run_query 작업의 행을 페이지 단위로 반환합니다. offset과 limit으로 페이지를 넘기고(nextOffset이 다음 페이지), 여러 문장 중 하나는 statement로 고릅니다. truncatedAt이 있으면 내 행 수 상한 때문에 전체 결과가 그 행 수에서 잘린 것이며, 페이지 크기가 아닙니다.
get_query_status=run_query 작업의 상태(EXECUTING, EXECUTED, FAILED, CANCELLED)와 문장별 상태, 행 수, 오류를 반환합니다.
cancel_query=실행 중인 run_query 작업을 취소합니다.
discover_roles=쿼리를 승인받아 실행할 수 있는 역할과 역할별 마스킹 여부를 조회합니다. request_approval의 roleName을 고르기 전에 호출하세요.
request_approval=더 높은 역할로 쿼리를 실행하도록 승인자에게 요청합니다. 거부된 run_query 문장의 decisionId를 넘기거나, datasource, sql, title을 넘기세요. roleName은 discover_roles에서 고르고, reason에는 필요한 이유를 적습니다.
list_my_approvals=내가 만든 쿼리 승인 요청을 조회합니다. status(PENDING, APPROVED, REJECTED, EXECUTING, EXECUTED, FAILED, CANCELLED)로 거를 수 있습니다.
list_approval_inbox=내가 승인하거나 거부할 수 있는 대기 중인 쿼리 승인 요청을 조회합니다.
get_approval=쿼리 승인 요청 하나와 문장별 실행 상태, 내가 할 수 있는 작업(결정, 실행, 취소)을 반환합니다.
approve_approval=대기 중인 쿼리 승인 요청을 승인합니다. 자신의 요청은 승인할 수 없습니다.
reject_approval=대기 중인 쿼리 승인 요청을 요청자가 볼 사유와 함께 거부합니다.
execute_approval=승인된 쿼리를 승인된 역할로 실행합니다. 승인한 승인자만 한 번 실행할 수 있습니다. EXECUTED가 될 때까지 get_approval로 확인한 뒤 get_approval_result로 행을 읽으세요.
get_approval_result=실행된 쿼리 승인의 행을 나에게 맞게 마스킹하여 페이지 단위로 반환합니다. offset과 limit으로 페이지를 넘기고(nextOffset이 다음 페이지), statement로 문장을 고릅니다. truncatedAt이 있으면 내 행 수 상한 때문에 전체 결과가 그 행 수에서 잘린 것이며, 페이지 크기가 아닙니다.
cancel_approval=아직 실행 중인 쿼리 승인을 취소합니다.
list_group_members=그룹 하나의 멤버를 조회합니다.
list_group_roles=그룹 하나가 멤버에게 부여하는 역할을 조회합니다.
get_principal_rate=주체 하나의 소진된 결과 한도가 마지막으로 초기화된 기록을 반환합니다. 초기화된 적이 없으면 null입니다.
reset_principal_rate=주체 하나의 소진된 결과 한도를 지금 초기화하고, 사유를 감사 기록에 남깁니다.
create_datasource=프록시가 처음 등록하기 전에 이름으로 데이터소스를 미리 만듭니다. engine은 postgres 또는 mysql이며, host, port, dbName은 프록시 등록 시 채워집니다.
update_datasource=데이터소스의 이름과 참고용 연결 정보를 수정합니다. 생략한 필드는 기존 값을 유지하며, 엔진은 바꿀 수 없습니다.
delete_datasource=데이터소스를 삭제합니다. 프록시가 연결되어 있거나 진행 중인 요청이 있으면 거부됩니다.
refresh_datasource=데이터소스에 연결된 모든 프록시에 카탈로그를 지금 다시 조회하도록 요청하고, 알린 프록시 수를 반환합니다.
test_datasource=데이터소스에 프록시가 연결되어 있는지와 카탈로그가 마지막으로 동기화된 시각을 알려 줍니다.
get_my_permissions=내 역할과 각 역할을 받은 경로(직접 부여, 그룹, 만료 시각이 있는 기간제 접근 권한)를 반환하고, 관리자인지, 전체 감사 기록을 읽을 수 있는지, 승인할 수 있는지도 함께 반환합니다. 쿼리가 왜 허용되거나 거부되는지, 어떤 역할을 요청해야 하는지 설명할 때 사용하세요.
list_audit=최근 감사 이벤트를 최신순으로 조회합니다. 전체 감사 기록을 읽을 권한이 있으면 모든 주체의 이벤트를, 없으면 내 이벤트만 봅니다. limit은 1~500, 기본값 100입니다.
get_audit_event=감사 이벤트 하나를 id로 조회합니다. 읽을 수 없는 이벤트는 없는 이벤트와 똑같이 찾을 수 없음으로 응답합니다.
request_access=승인자에게 일정 시간 동안 역할을 부여해 달라고 요청합니다(JIT 권한 상승). roleName은 역할, reason은 사유, datasource는 선택적으로 요청 범위를 정하고, durationSec은 부여 기간입니다(기본값 3600).
list_access_requests=볼 수 있는 역할 요청과 한도 초기화 요청을 조회합니다. status(PENDING, APPROVED, REJECTED)로 거를 수 있습니다.
list_access_grants=볼 수 있는 역할 부여를 조회합니다. principal은 누구의 부여를 찾을지 정하고, active는 아직 유효한 부여로 제한합니다.
reset_my_rate=승인자에게 소진된 내 결과 한도를 초기화해 달라고 요청합니다. reason은 사유, denyReason은 거부될 때 받은 한도 메시지입니다.
list_query_history=콘솔 편집기 기록에서 최근에 실행한 서로 다른 쿼리를 최신순으로 조회합니다. limit은 1~200, 기본값 50입니다.
clear_query_history=편집기 쿼리 기록 전체를 삭제하고, 삭제된 행 수를 반환합니다.
delete_query_task=내 run_query 작업 하나와 저장된 결과를 삭제합니다. 내 작업이 아니거나 없으면 deleted가 false입니다.
approve_access_request=대기 중인 역할 요청 또는 한도 초기화 요청을 승인합니다. durationSec으로 역할 부여 기간을 바꿀 수 있습니다. 내 요청은 승인할 수 없으며, 쿼리 승인은 approve_approval을 사용합니다.
reject_access_request=대기 중인 역할 요청 또는 한도 초기화 요청을 요청자에게 보일 사유와 함께 거부합니다.
revoke_access_grant=유효한 역할 부여를 만료 전에 회수합니다.
