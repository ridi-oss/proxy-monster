version: v2
# `mise run proto-generate` scopes this module to the services cp-go serves to the Kotlin control plane
# over cpgo/gobridge, one proto file each; add a new one to that task and to proto-check.
plugins:
  - local: protoc-gen-go
    out: gobridge/pb
    opt: paths=source_relative,Mgithub_source.proto=github.com/ridi-oss/proxy-monster/cpgo/gobridge/pb;bridgepb
  - local: protoc-gen-go-grpc
    out: gobridge/pb
    opt: paths=source_relative,Mgithub_source.proto=github.com/ridi-oss/proxy-monster/cpgo/gobridge/pb;bridgepb
