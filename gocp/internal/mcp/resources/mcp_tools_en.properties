list_datasources=List datasources and their connection, catalog, and tag metadata.
get_datasource_liveness=Get the current proxy attachment status for a datasource.
browse_catalog=Browse the schemas, tables, and columns in a datasource catalog.
get_table_detail=Inspect live column details for one datasource table.
list_column_tags=List classified columns and their tags in a datasource.
set_column_classification=Set tags and an optional mask function on one column.
clear_column_classification=Remove the classification from one column.
list_policies=List Cedar policies.
get_policy=Get one Cedar policy by name.
validate_policy=Validate Cedar policy source without saving it.
get_policy_schema=Get the Cedar schema used for access-control policies.
create_policy=Create a Cedar policy.
update_policy=Update a Cedar policy by name.
enable_policy=Enable a Cedar policy.
disable_policy=Disable a Cedar policy.
delete_policy=Delete a user-managed Cedar policy.
list_roles=List access-control roles.
create_role=Create an access-control role.
