version: v2
# The Mcontrolplane.proto option supplies the Go package without modifying the shared contract.
# `mise run proto-generate` scopes this module to controlplane.proto so it never picks up
# analyzer.proto (owned by analyzer/buf.gen.yaml).
#
# controlplane.proto imports the shared engine.proto (proxymonster.v1.Engine) but this module does
# NOT generate a second copy of it: goproxy links analyzer/probe into the same binary (introspect.go,
# db.go), which already generates engine.proto into analyzer/probe/pb — two independently-generated
# Go types for the same logical .proto file panic the protobuf runtime's global file registry at
# init ("file already registered") the instant both packages are imported into one process. The
# M-option below instead points engine.proto's Go package AT analyzer/probe/pb, so RegisterRequest's
# Engine field resolves to that ALREADY-REGISTERED type — one Go type, shared, not two colliding ones.
# analyzer.proto is mapped the same way: controlplane.proto now references its RequireResultReadGrant on the
# result-view fingerprint, and that type is already generated into analyzer/probe/pb — reuse it, don't
# regenerate a colliding copy.
plugins:
  - local: protoc-gen-go
    out: internal/pb
    opt: paths=source_relative,Mcontrolplane.proto=github.com/ridi-oss/proxy-monster/goproxy/internal/pb;proxymonsterv1,Mengine.proto=github.com/ridi-oss/proxy-monster/analyzer/probe/pb,Manalyzer.proto=github.com/ridi-oss/proxy-monster/analyzer/probe/pb
  - local: protoc-gen-go-grpc
    out: internal/pb
    opt: paths=source_relative,Mcontrolplane.proto=github.com/ridi-oss/proxy-monster/goproxy/internal/pb;proxymonsterv1,Mengine.proto=github.com/ridi-oss/proxy-monster/analyzer/probe/pb,Manalyzer.proto=github.com/ridi-oss/proxy-monster/analyzer/probe/pb
