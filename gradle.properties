# A Gradle daemon is machine-wide state shared by every build on the host, so one build's lifecycle
# event can recycle a JVM another process depends on. Off by default here, so an ad-hoc `./gradlew`
# is structurally incapable of touching anything outside itself.
org.gradle.daemon=false
org.gradle.caching=true
kotlin.code.style=official
# Gradle's default 512m heap, which the Kotlin daemon inherits, runs out compiling the control-plane tests.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx3g
