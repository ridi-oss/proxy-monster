syntax = "proto3";

package proxymonster.athena.v1;

import "google/protobuf/timestamp.proto";

option java_package = "com.ridi.oss.proxymonster.athena.pb";
option java_multiple_files = true;

// Athena is an HTTP API, not a wire protocol: a query is one StartQueryExecution call whose body carries
// the SQL text plus the fields below, and prepared statements live in a named workgroup rather than a
// session. This is the part of that call the analyzer needs beyond the text.
message AthenaSqlContext {
  // The workgroup the query runs in; prepared statements are looked up by (workgroup, name).
  string workgroup = 1;
  // The client's positional bindings for the `?` placeholders in the SQL, in order, as SQL expressions:
  //   SQL "SELECT email FROM users WHERE id = ? AND region = ?" with ["7", "'kr'"].
  repeated string execution_parameters = 2;
  // Prepared statements the proxy fetched from AWS for this request, after the analyzer asked for them
  // (StatementFacts.athena_prepared_definition_need). Never taken from the client.
  repeated AthenaPreparedDefinition prepared_definitions = 3;
  // Editor row cap; a resolved query gets LIMIT max_rows when it has none or a larger one. 0 = no cap.
  uint32 max_rows = 4;
}

// One prepared statement as AWS stores it: `PREPARE lookup_user FROM SELECT email FROM users WHERE id = ?`
// in workgroup "primary" is {workgroup: "primary", name: "lookup_user", query_string: "SELECT email ..."}.
message AthenaPreparedDefinition {
  string workgroup = 1;
  string name = 2;
  string query_string = 3;
}

// A control-plane command: fetch this prepared statement from AWS and retry the decision with it.
message FetchAthenaPreparedDefinition {
  string workgroup = 1;
  string name = 2;
}

// The analyzer's request for a prepared statement it was not given (see
// StatementFacts.athena_prepared_definition_need).
message AthenaPreparedDefinitionNeed {
  string workgroup = 1;
  string name = 2;
}

// The parameter list the proxy submits with StatementFacts.rewritten_sql in place of the client's (see
// StatementFacts.athena_submission for the worked example). Presence replaces the client's list even when
// empty; absence keeps it.
message AthenaSubmission {
  repeated string execution_parameters = 1;
}

enum NativeAuthorizationPhase {
  NATIVE_AUTHORIZATION_PHASE_UNSPECIFIED = 0;
  NATIVE_AUTHORIZATION_PHASE_REQUEST = 1;
  NATIVE_AUTHORIZATION_PHASE_RESPONSE = 2;
}

message NativeHeader {
  string name = 1;
  repeated string values = 2;
}

enum AthenaObservationSource {
  ATHENA_OBSERVATION_SOURCE_UNSPECIFIED = 0;
  ATHENA_OBSERVATION_SOURCE_AWS_RESPONSE = 2;
}

message AthenaResourceObservation {
  AthenaObservationSource source = 1;
  string kind = 2;
  string id = 3;
  optional string owner = 4;
  string workgroup = 5;
}

// Decoded only by the Athena provider; credentials, cookies, signatures, and result rows are forbidden.
message AthenaNativeDescriptor {
  string service = 1;
  string operation = 2;
  string method = 3;
  string path = 4;
  string raw_query = 5;
  repeated NativeHeader functional_headers = 6;
  // The sanitized request body in both phases; response resources belong in observations, never result cells.
  bytes body = 7;
  NativeAuthorizationPhase phase = 8;
  // AWS-observed resource identities, never client assertions or cached ownership claims.
  repeated AthenaResourceObservation observations = 9;
  repeated AthenaCachedContext cached_contexts = 10;
  AthenaTarget target = 11;
}

message AthenaTarget {
  string region = 1;
  string default_workgroup = 2;
  string default_catalog = 3;
  string default_database = 4;
  string endpoint = 5;
  // Canonical configured target and stable upstream account/principal identity, attested by the proxy.
  bytes target_binding = 6;
}

message AthenaCachedContext {
  uint32 version = 1;
  string context_id = 2;
  string resource_id = 3;
  string owner = 4;
  bytes target_binding = 5;
  google.protobuf.Timestamp expires_at = 6;
  optional uint32 expected_width = 7;
  bytes metadata_digest = 8;
  bytes request_binding = 9;
  // Canonical Verdict containing only decision, masks, unmaskable_permitted, sanitize_diagnostics, decision_id.
  bytes enforcement_instructions = 10;
}

enum AthenaNativeInstruction {
  ATHENA_NATIVE_INSTRUCTION_UNSPECIFIED = 0;
  ATHENA_NATIVE_INSTRUCTION_FORWARD_REQUEST = 1;
  ATHENA_NATIVE_INSTRUCTION_REQUIRE_SQL_ADMISSION = 2;
  ATHENA_NATIVE_INSTRUCTION_RELEASE_METADATA = 3;
  ATHENA_NATIVE_INSTRUCTION_APPLY_ORIGINAL_CONTEXT = 4;
}

message AthenaContextRef {
  string resource_id = 1;
  string context_id = 2;
}

// Permission applies only to this instruction and phase, never arbitrary response bytes.
message AthenaNativeInstructions {
  AthenaNativeInstruction action = 1;
  repeated AthenaContextRef contexts = 2;
}
