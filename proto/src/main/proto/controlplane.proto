syntax = "proto3";

// The proxy <-> control-plane wire protocol (docs/datasource-registration.md).
// Single source of truth for both sides' generated bindings. Internal, trusted
// service-to-service surface only — the web UI keeps talking HTTP/JSON to control-plane.
package proxymonster.v1;

import "engine.proto";
import "analyzer.proto";
import "google/protobuf/empty.proto";

option java_package = "com.ridi.oss.proxymonster.grpc";
option java_multiple_files = true;

// The enforcement verdict (control-plane Query.kt EnfAction). Proto3 reserves 0 for a fail-closed
// UNSPECIFIED sentinel, so these numbers deliberately do NOT match the Kotlin enum's ordinals
// (ALLOW=0/MASK=1/DENY=2 there). Map by NAME across the wire, never by ordinal.
enum EnfAction {
  ENF_ACTION_UNSPECIFIED = 0;
  ALLOW = 1;
  MASK = 2;
  DENY = 3;
}

// Generic, extensible command the proxy executes mechanically. REFETCH is today's only value.
message ProxyCommand {
  oneof command {
    Refetch refetch = 1;   // future commands add arms here
  }
}
message Refetch {
  string schema = 1;          // the schema to conditionally re-introspect
  // The control-plane's currently-held content hash for (connection, schema).
  // Empty/absent means unconditional fetch (fail-safe).
  bytes if_hash_differs = 2;
}

service ControlPlane {
  // A proxy declares its identity on boot. Idempotent, upsert by name.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // The proxy pushes the catalog it introspected itself.
  rpc PushCatalog(CatalogRequest) returns (CatalogResponse);
  // Wire-protocol auth handshake — once per session. "May this session open?"
  rpc ValidateToken(ValidateTokenRequest) returns (WireIdentity);
  // Per-query enforcement decision. Takes the RAW token, re-validated +
  // re-resolved server-side every call — never a client-cached principal.
  rpc Decide(DecisionRequest) returns (WireDecision);
  // Per-connection schema fragment push on the enforcement channel.
  rpc PushSchemaFragment(SchemaFragmentPush) returns (SchemaFragmentAck);
  // Proxy-initiated connection close; the control-plane idle-sweep is the backstop.
  rpc CloseConnection(CloseConnectionRequest) returns (CloseConnectionResponse);
  // Proxy-initiated stream: liveness (stream open == alive) + refresh push.
  rpc Events(EventsRequest) returns (stream ControlEvent);
  // The CP-driven execution channel. PROXY-DIALED bidi: the control-plane nudges the proxy over Events
  // (OpenRunChannel) to open this, so data flows both ways without the control-plane ever dialing into the
  // proxy. It serves web-editor and workflow execution through the same target DB + Decide path, streaming
  // the decision and masked rows back.
  rpc RunExec(stream ProxyRunMsg) returns (stream ControlRunMsg);
  // On-demand admin table-browser introspection. Also PROXY-DIALED: request selectors ride the Events
  // nudge and the rich shared TableDetail response returns as JSON on this short-lived channel.
  rpc TableDetailExec(stream ProxyTableDetailMsg) returns (stream ControlTableDetailMsg);
  // Post-execution result-volume report the proxy sends after it finishes relaying one statement's result
  // to the client. Audit-only: it records a completion event chained onto the decision's audit row (never
  // a re-decision), giving the audit monitor the rows/bytes signal the pre-execution decision could not
  // carry. Best-effort — the proxy fires it off the client session's critical path and a failure never
  // affects the query. A DENY relays nothing, so it produces no completion.
  rpc ReportCompletion(CompletionReport) returns (google.protobuf.Empty);
}

// The proxy's post-relay result-volume signal for one statement, correlated to its decision by
// decision_id (Verdict.decision_id, the audit id the Decide response carried). rows_returned +
// bytes_returned are the volume the audit monitor's mass-export rule keys on; status is one of
// ok|error|canceled (error/cancel carry the partial counts relayed before the fault); duration_ms is the
// relay wall time. decision_id 0 is rejected (a statement with no recorded decision is never reported).
message CompletionReport {
  int64 decision_id = 1;
  int64 rows_returned = 2;
  int64 bytes_returned = 3;
  string status = 4;
  int64 duration_ms = 5;
}

// ---- Registration ----
message RegisterRequest {
  string name = 1;              // stable identity; Cedar's Datasource::"<name>"; upsert key
  Engine engine = 2;
  string host = 3;              // advisory only (admin UI / triage)
  int32 port = 4;               // advisory only
  string db_name = 5;           // advisory only
  repeated string tags = 6;     // optional free-form; posture tags system:development/system:production; empty => production floor via deny-by-default (policy-store.md)
  string advertise_addr = 7;    // client-facing host:port a wire client dials to reach THIS datasource's proxy (not the upstream host/port above); empty when the proxy isn't told its reachable address. Surfaced by GET /api/datasources so a client (pmon) can open a local broker per datasource.
  // Reserved: a leaf SHA-256 clients pinned against, and the leaf alone. Neither number may be reused.
  reserved 8, 9;
  // The certificate CHAIN a client should trust to reach this proxy: PEM, leaf first, followed by any
  // intermediates and the root. A self-signed cert is the one-element case. Every client verifies against
  // this the ordinary way -- pmon as its root pool, psql/mysql/DataGrip as sslrootcert / --ssl-ca with
  // verify-full -- so there is one trust mechanism rather than a separate pinning path. Served by
  // GET /api/datasources/{id}/wire-cert.
  //
  // Empty does NOT mean "no TLS": an operator may serve a publicly-trusted cert and publish nothing
  // (PM_TLS_NO_ADVERTISE), leaving clients to their own trust store. Read advertise_wire_tls for that.
  //
  // `optional` for explicit presence, which the control plane needs to tell two different intents apart:
  // ABSENT means "no opinion, keep whatever is stored" (a transient cert read at re-register), while
  // PRESENT-but-empty means "publish nothing for this datasource" and CLEARS the stored chain. Without
  // presence, a momentary read error and a deliberate stop-publishing look identical, and clients would keep
  // verifying against roots the proxy no longer serves.
  optional string advertise_cert_chain = 10;
  // Whether this proxy serves client-facing TLS at all. Authoritative and independent of the chain above,
  // because trust MATERIAL and the TLS REQUIREMENT are different facts: a proxy can serve TLS while
  // publishing no chain, and a transient cert-read at re-register sends no chain without TLS going away.
  // A client that knows TLS is expected refuses to fall back to plaintext -- which is what stops an on-path
  // attacker from answering with a no-TLS greeting and collecting the token in the clear.
  bool advertise_wire_tls = 11;
  // The proxy's wire-protocol version. A server-v* release ships the proxy and control-plane at the same
  // version, so the control-plane rejects a mismatch at Register (the proxy's first call) and the proxy makes
  // the mirror check against RegisterResponse.protocol_version below — a half-finished rollout fails fast with
  // a clear error rather than a stalled run channel. A proxy that predates this field sends 0.
  int32 protocol_version = 12;
}
message RegisterResponse {
  string name = 1;
  // The control-plane's wire-protocol version, so the proxy can refuse a control-plane it cannot talk to. A
  // control-plane that predates this field sends 0.
  int32 protocol_version = 2;
}

// ---- Catalog ----
message Column {
  string schema = 1;
  string table = 2;
  string column = 3;
  string data_type = 4;
  int32 ordinal = 5;
  bool nullable = 6;
}
message CatalogRequest {
  string datasource_name = 1;
  repeated string default_schemas = 2;               // load-bearing: PG current_schemas(true)
  optional int32 mysql_lower_case_table_names = 3;    // load-bearing on MySQL
  repeated Column columns = 4;
  // The target's live server version (`SELECT version()`, with an `(aurora <v>)` suffix when the
  // Aurora-only `aurora_version()` resolves). The control-plane cannot probe this itself (it never
  // dials the target), yet system-classification (docs/system-classification.md) resolves its manifest by
  // the datasource's major engine version + Aurora-ness — so the proxy, the only side with a live
  // connection, supplies it. Raw string; the control-plane owns parsing the major + Aurora marker.
  string engine_version = 5;
}
message CatalogResponse {
  int32 columns = 1;   // ack: rows stored
}

// ---- Auth handshake ----
message ValidateTokenRequest {
  string token = 1;
  string datasource_name = 2;
  string client_addr = 3;   // end-client address, for the audit record
}
message WireIdentity {
  string principal = 1;
  repeated string roles = 2;
  bytes connection_id = 3;             // 128-bit control-plane-minted CSPRNG
  repeated ProxyCommand on_open = 4;   // REFETCH per default + system schema
}

// ---- Per-connection catalog ----
message SchemaFragmentPush {
  bytes connection_id = 1;
  string datasource_name = 2;
  string schema = 3;
  bytes content_hash = 4;               // the live DB-side hash the proxy just measured for this schema
  bool unchanged = 5;                   // true = live hash matched the REFETCH hash; columns omitted (no-op ack)
  repeated Column columns = 6;          // enforcement-relevant fields; reuses the catalog Column shape
  uint64 backend_generation = 7;        // target-DB-connection instance that measured this fragment
}
message SchemaFragmentAck {
  uint64 generation = 1;                // per-connection generation after applying
}
message CloseConnectionRequest {
  bytes connection_id = 1;
  string datasource_name = 2;
}
message CloseConnectionResponse {}

// ---- Per-query decision ----
message DecisionRequest {
  string token = 1;                 // re-validated + re-resolved server-side on every call
  string datasource_name = 2;
  string sql = 3;
  repeated string search_path = 4;
  string client_addr = 5;           // end-client address, for the audit record
  // Per-connection catalog freshness: the session/temp tables live on THIS connection, invisible
  // to the datasource-global catalog. The proxy introspects them off its held connection and sends them so
  // the control-plane resolves a bare name to the connection's temp (matching what the target DB binds) instead
  // of a shadowed real table. Editor-session only; empty for one-shot/wire paths.
  repeated TempColumn temp_columns = 6;
  bytes connection_id = 7;
  // Whether the target DB's live MySQL session sql_mode has ANSI_QUOTES active, observed by the proxy per
  // statement (sql_mode is mutable per session). The control-plane forwards it to the analyzer's
  // EngineConfig so `"col"` is parsed as a quoted identifier (a masked column read) rather than a string,
  // letting the proxy relay an ANSI_QUOTES session under masking instead of failing it closed. Absent/false
  // for PostgreSQL and the default MySQL mode. NO_BACKSLASH_ESCAPES / ANSI stay fail-closed at the proxy.
  bool mysql_ansi_quotes = 8;
  // Visible non-pg_catalog overloads that can change PostgreSQL's resolution of an unqualified
  // builtin with an analyzer-supplied implicit output schema. Observed on the held target-DB session
  // with the effective function search path; empty for MySQL.
  repeated string postgres_shadowed_functions = 9;
  // True only when the proxy successfully observed PostgreSQL function visibility on the held session.
  // False is distinct from an observed empty shadow list and keeps implicit polymorphic schemas closed.
  bool postgres_function_shadowing_observed = 10;
  // Whether pg_catalog.xid is the type PostgreSQL resolves for an unqualified xid on the held session.
  // Absence means type visibility was not observed and the analyzer keeps the cast gated fail-closed.
  optional bool postgres_system_xid_visible = 11;
}

// One column of a session-temp table on a connection. Carries no classification — a temp is
// unclassified; the write-references-masked deny at CREATE time ensures a temp only ever holds data its
// creator was entitled to read, so an editor session reading its own temp is safe (elevation is a separate,
// one-shot path that does not create persistent-session temps).
message TempColumn {
  string schema = 1;      // the temp namespace as the target DB reports it (e.g. a pg_temp_N schema)
  string table = 2;
  string column = 3;
  string sql_type = 4;
  int32 ordinal = 5;
}
message ColumnMask {
  string column = 1;
  string mask_fn = 2;
  string kind = 3;
  // `optional` gives explicit presence so an absent ordinal is distinguishable from a legitimate 0.
  // Without it, proto3's implicit-zero default would silently bind a malformed/omitted mask to result
  // column 0 — masking the wrong column and leaking the intended one. The mapper must reject absence
  // fail-closed rather than treat it as column 0.
  optional int32 ordinal = 4;
}
message WireDecision {
  reserved 8;
  reserved "after_commit";
  // before_decide carries NO verdict: run commands, then re-send the same request.
  // A message with neither outcome arm set must fail closed.
  oneof outcome {
    Verdict verdict = 1;
    BeforeDecide before_decide = 2;
  }
}
message Verdict {
  EnfAction decision = 1;
  string deny_reason = 2;
  repeated ColumnMask masks = 3;
  repeated string effective_roles = 4;
  // `optional` preserves the load-bearing null semantics: ABSENT = forward the client's original SQL
  // verbatim (no `*`-expansion rewrite). A plain proto3 string would collapse that to "", making the
  // mapper send an empty query for every non-rewritten decision.
  optional string rewritten_sql = 5;
  int64 decision_id = 6;            // 0 == none (BIGSERIAL audit ids start at 1, so 0 is a safe sentinel)
  // Plain bool: absent/false means not permitted and the proxy refuses fail-closed. Set only for MASK.
  bool unmaskable_permitted = 7;
  // Runs after a committed catalog-changing statement succeeds, refreshing that connection's held
  // schema fragment(s): one Refetch per touched schema, each bearing the real schema name and (when the
  // control-plane holds a prior hash) an if_hash_differs guard so an unchanged fragment is skipped. This
  // keeps the committed-DDL stale-catalog gate closed. A blank-schema Refetch is never emitted (the proxy
  // rejects it fail-closed).
  repeated ProxyCommand after_statement = 8;
  uint64 generation = 9;            // per-connection generation this verdict was computed under
  // The diagnostic-redaction flag. When set, the proxy strips target-DB error/notice messages on
  // this connection down to code + severity + a generic message (docs/diagnostic-redaction.md) — DB
  // diagnostics echo stored values that masking hides, so they are an unmasked side-channel. It is an
  // imperative command the proxy executes mechanically (not statement meaning), evaluated fresh per
  // decision and NOT latched: the control plane sets it on any decision whose diagnostics could carry a
  // protected value. A blanket bool, deliberately DENY-inclusive and whole-row-safe.
  bool sanitize_diagnostics = 10;
  // The decision's authorization requirements (the analyzer's result-read grants). The proxy does not read
  // them — like decision_id, it echoes them back on RunDecision purely so an execute-under-R run freezes
  // them with the stored result and a later view can deny authorization drift (the control-plane result-view
  // gate). Empty for a decision that needs no result-read grants.
  repeated proxymonster.analyzer.v1.RequireResultReadGrant result_fingerprint = 11;
}
message BeforeDecide {
  repeated ProxyCommand commands = 1;
}

// ---- Liveness + refresh ----
message EventsRequest {
  string datasource_name = 1;
  // The proxy's wire-protocol version, sent on the liveness stream exactly as on Register. Register is the
  // primary version guard, but the datasource row outlives it: an old proxy whose Register was rejected can
  // still open this stream against the persisted row and be treated as live, so the control-plane rejects a
  // mismatch here too. A proxy that predates this field sends 0, which fails the check like an old Register.
  int32 protocol_version = 2;
}
message ControlEvent {
  oneof kind {
    RefreshCatalog refresh_catalog = 1;
    OpenRunChannel open_run_channel = 2;   // nudge the proxy to dial RunExec for a session
    OpenTableDetailChannel open_table_detail_channel = 3;
    Draining draining = 4;   // this control-plane is shutting down; close and reconnect so the stream re-homes
    // room for more (tag/config change, revocation hint, ...) without a shape change
  }
}
message RefreshCatalog {}
// Sent once to every open Events stream when the control-plane is draining for shutdown, immediately before
// the stream is closed. The proxy reconnects without the error backoff, so its liveness re-homes to the
// replacement instance in one reconnect instead of waiting out a max-age rotation or a dropped connection.
message Draining {}
// The control-plane asks the proxy to open a RunExec stream for a CP-driven session. The proxy dials back
// with RunExec tagging this session_id. The ephemeral_token is a short-lived wire token minted for the
// requester — the proxy re-presents it to its normal Decide path, so editor and workflow queries share
// the exact same enforcement and result-relay channel.
message OpenRunChannel {
  string session_id = 1;
  string ephemeral_token = 2;
  bytes connection_id = 3;             // control-plane-minted for the run session
  repeated ProxyCommand on_open = 4;
}
// The request selectors ride the control-plane's Events response; the proxy then dials TableDetailExec
// and correlates the stream with session_id. No query token is needed: this is metadata-only introspection.
message OpenTableDetailChannel {
  string session_id = 1;
  string schema = 2;
  string table = 3;
}

// ---- CP-driven run channel ----
// The proxy dials RunExec and sends ProxyRunMsg; the control-plane replies with ControlRunMsg.
message ProxyRunMsg {
  oneof kind {
    RunReady session_ready = 1;       // first message, sent the instant the stream opens: tells the control-
                                      // plane which pending run this stream serves (the OpenRunChannel it
                                      // dispatched) — BEFORE the target-DB open begins
    RunDecision decision = 2;         // the enforcement verdict + UX metadata (before any rows)
    RunResultRows result_rows = 3;    // masked rows (ALLOW/MASK only)
    RunDone done = 4;                 // terminal success (rows_affected for a write)
    RunError error = 5;               // terminal failure (target-DB error, unsupported, ...)
    RunProgress progress = 6;         // liveness heartbeat during the target-DB open; resets the CP's no-progress bound
    RunServing serving = 7;           // the target DB is connected and its on-open catalog work is done —
                                      // the control-plane may now send the query
  }
}
message ControlRunMsg {
  oneof kind {
    RunQuery query = 1;
    RunClose close = 2;   // drop the session's target-DB connection; the proxy closes the stream
    RunCancel cancel = 3; // cancel the in-flight statement out-of-band; a no-op when none is running
  }
}
message RunReady { string session_id = 1; }
// A target-DB open liveness heartbeat: the proxy emits these while dialing + authenticating the target DB and
// running its on-open catalog commands, so the control-plane can bound the open by lack of progress rather
// than by a blind dial budget. It carries no payload — the control-plane treats every RunProgress purely as
// "the proxy is still alive".
message RunProgress {}
// The target-DB open finished and the proxy is ready to accept the query. Sent once, after the last
// RunProgress and before any RunDecision.
message RunServing {}
message RunQuery {
  string sql = 1;
  int32 max_rows = 2;   // 0 = the proxy's default cap
}
message RunClose {}
message RunCancel {}
// The decision the proxy produced for the query — carries metadata rendered around results or persisted by
// workflows: decision_id identifies the audit decision, masked_columns names masked outputs, deny_reason
// explains a denial, and effective_roles records the role set used by Decide.
message RunDecision {
  EnfAction decision = 1;
  int64 decision_id = 2;   // 0 == none
  repeated string masked_columns = 3;
  string deny_reason = 4;
  repeated string effective_roles = 5;
  // The decision's authorization requirements (the analyzer's result-read grants), forwarded from
  // Verdict.result_fingerprint. An execute-under-R run freezes them with the stored result so a later view
  // denies authorization drift.
  repeated proxymonster.analyzer.v1.RequireResultReadGrant result_fingerprint = 6;
  // Verdict.sanitize_diagnostics echoed back, so the caller returns the failure form the decision
  // dictated: redacted when set, raw otherwise.
  bool sanitize_diagnostics = 7;
}
message RunResultRows {
  repeated string columns = 1;
  repeated RunRow rows = 2;
}
message RunRow {
  // Per-column rendered value; is_null distinguishes a real SQL NULL from an empty string.
  repeated RunValue values = 1;
}
message RunValue {
  string value = 1;
  bool is_null = 2;
}
message RunDone { int32 rows_affected = 1; }   // -1 when not applicable (a SELECT)
// A run's terminal error. Also the at-rest form of a failed run's diagnostic: for a target-DB failure the
// control-plane serializes this whole message (protobuf) and AES-GCM encrypts it into
// query_result.error_detail, re-gated per viewer at view time — same field semantics on the wire and at rest.
message RunError {
  // For a target-DB statement ERR (target_db_error) this is the REDACTED, value-free message (essno +
  // SQLSTATE + symbol, no echoed value); for every other failure it is the plain error text. The safe
  // default the control-plane surfaces — the raw form is opt-in via raw_message.
  string message = 1;
  // Set ONLY for a genuine target-DB statement ERR; false for every proxy/control-plane/decode/decision/
  // mask-binding failure. Gates whether the control-plane may surface an error detail at all
  // (docs/diagnostic-redaction.md).
  bool target_db_error = 2;
  // Set ONLY for a target-DB statement ERR: the RAW backend message, which can echo a protected value. The
  // control-plane stores it beside the redacted [message] and releases it only to a viewer who reads
  // unmasked — a stored failure is re-gated per viewer like the rows, and an error string cannot be masked
  // by ordinal.
  string raw_message = 3;
}

// ---- Admin table-browser introspection channel ----
message ProxyTableDetailMsg {
  oneof kind {
    TableDetailReady session_ready = 1;   // first message: correlates this stream to its Events nudge
    TableDetailResult result = 2;         // shared engine TableDetail JSON; literal `null` means not found
    TableDetailError error = 3;           // terminal target/introspection failure
  }
}
message ControlTableDetailMsg {
  oneof kind {
    TableDetailClose close = 1;
  }
}
message TableDetailReady { string session_id = 1; }
message TableDetailResult { string json = 1; }
message TableDetailError { string message = 1; }
message TableDetailClose {}
