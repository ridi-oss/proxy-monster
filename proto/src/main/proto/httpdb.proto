syntax = "proto3";

package proxymonster.httpdb.v1;

import "google/protobuf/timestamp.proto";

option java_package = "com.ridi.oss.proxymonster.httpdb.pb";
option java_multiple_files = true;

// What every engine behind an HTTP API (such as Athena) shares; each engine's
// own descriptor carries the operation, observations, and target.

enum HttpDbAuthorizationPhase {
  HTTP_DB_AUTHORIZATION_PHASE_UNSPECIFIED = 0;
  HTTP_DB_AUTHORIZATION_PHASE_REQUEST = 1;
  HTTP_DB_AUTHORIZATION_PHASE_RESPONSE = 2;
}

message HttpDbHeader {
  string name = 1;
  repeated string values = 2;
}

// The decision a provider execution was admitted under, keyed by (datasource, resource_id): an Athena
// QueryExecutionId.
message HttpDbCachedContext {
  uint32 version = 1;
  string context_id = 2;
  string resource_id = 3;
  string owner = 4;
  bytes target_binding = 5;
  google.protobuf.Timestamp expires_at = 6;
  optional uint32 expected_width = 7;
  bytes metadata_digest = 8;
  bytes request_binding = 9;
  // Canonical Verdict containing only decision, masks, unmaskable_permitted, sanitize_diagnostics, decision_id.
  bytes enforcement_instructions = 10;
}

enum HttpDbInstruction {
  HTTP_DB_INSTRUCTION_UNSPECIFIED = 0;
  HTTP_DB_INSTRUCTION_FORWARD_REQUEST = 1;
  HTTP_DB_INSTRUCTION_REQUIRE_SQL_ADMISSION = 2;
  HTTP_DB_INSTRUCTION_RELEASE_METADATA = 3;
  HTTP_DB_INSTRUCTION_APPLY_ORIGINAL_CONTEXT = 4;
}

message HttpDbContextRef {
  string resource_id = 1;
  string context_id = 2;
}

// Permission applies only to this instruction and phase, never arbitrary response bytes.
message HttpDbInstructions {
  HttpDbInstruction action = 1;
  repeated HttpDbContextRef contexts = 2;
}

// What an engine's SQL call carries beside the text and its namespace: an Athena StartQueryExecution or a
// BigQuery jobs.query.
message HttpDbSqlContext {
  // The request's parameters, in request order, each a SQL expression the analyzer binds into the text:
  //   "SELECT email FROM users WHERE id = ?" with [{value: "7"}]. A named one (BigQuery @id) has a name.
  repeated HttpDbParameter parameters = 1;
  // Editor row cap; a resolved query gets LIMIT max_rows when it has none or a larger one. 0 = no cap.
  uint32 max_rows = 2;
}

message HttpDbParameter {
  string name = 1;
  string value = 2;
}
