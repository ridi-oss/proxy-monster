# Datastores for the end-to-end smoke run, on their own compose project and host ports so a
# developer's `mise run up` stack keeps running alongside.
services:
  pm-postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: proxymonster
      POSTGRES_USER: proxymonster
      POSTGRES_PASSWORD: proxymonster
    ports:
      - "${SMOKE_CP_DB_PORT:-47010}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxymonster -d proxymonster"]
      interval: 3s
      timeout: 5s
      retries: 20

  target-mysql:
    image: mysql:8.4
    command: ["--mysql-native-password=ON"]
    environment:
      MYSQL_DATABASE: acme
      MYSQL_USER: acme
      MYSQL_PASSWORD: acme
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${SMOKE_MYSQL_PORT:-47011}:3306"
    volumes:
      - ../deploy/seed/target-seed-mysql.sql:/docker-entrypoint-initdb.d/target-seed-mysql.sql
      - ./mysql-grants.sql:/docker-entrypoint-initdb.d/zz-mysql-grants.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uacme", "-pacme"]
      interval: 3s
      timeout: 5s
      retries: 40

  target-postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: acme
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${SMOKE_PG_PORT:-47012}:5432"
    volumes:
      - ../deploy/seed/target-seed.sql:/docker-entrypoint-initdb.d/target-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme -d acme"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Athena emulator: MiniStack's full image (DuckDB execution) built from the branch that serves a
  # Glue-backed catalog. The Athena proxy points at it through AWS_ENDPOINT_URL; the emulator serves HTTPS
  # with a self-signed cert because the proxy forwards only to an HTTPS origin.
  athena:
    image: ${SMOKE_ATHENA_IMAGE:-pm-smoke-athena:66652278}
    build:
      context: https://github.com/sjincho/ministack.git#66652278d4f62d58ce1bd3009952f84ded065574
      dockerfile: Dockerfile.full
    environment:
      USE_SSL: "1"
      ATHENA_ENGINE: duckdb
      S3_PERSIST: "1"
      PERSIST_STATE: "0"
      MINISTACK_ACCOUNT_ID: "000000000000"
      MINISTACK_REGION: us-east-1
    ports:
      - "${SMOKE_ATHENA_PORT:-47013}:4566"
    volumes:
      - ./athena/seed.py:/docker-entrypoint-initaws.d/ready.d/seed.py:ro
    healthcheck:
      # Ready, not merely healthy: the seed script has run.
      test:
        python -c "import ssl,urllib.request as r;
        r.urlopen('https://localhost:4566/_ministack/ready',
        context=ssl._create_unverified_context())"
      interval: 3s
      timeout: 5s
      retries: 40
